<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="shortcut icon" type="image" href="./image/logo.svg">
  <title>Logout</title>
</head>
<body>
  <div id="page" class="site login-show">
    <div class="container">
      <div class="wrapper">
        <div class="login">
          <div class="content-heading">
            <div class="y-style">
              <div class="logo"><a href="#">He<span>llo</span></a></div>
              <div class="welcome">
                <h2 id="welcomeMessage">Welcome</h2>
                <p>We can help you grow</p>
              </div>
            </div>
          </div>
          <div class="content-form">
            <div class="y-style">
              <!-- user info section -->
              <div id="userInfo" style="margin-bottom: 20px; font-size: 15px;"></div>

              <!-- logout form -->
              <form method="GET" id="logoutForm">
                <p><button type="submit" name="logout">Logout</button></p>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
  const token = localStorage.getItem('access_token');
  const userInfoDiv = document.getElementById('userInfo');
  const logoutForm = document.getElementById('logoutForm');

  if (token) {
    try {
      const payload = JSON.parse(atob(token.split('.')[1]));
      console.log("JWT Payload:", payload);
      const username = payload.username || payload.sub;

      if (!username) {
        throw new Error("No username in token");
      }
      console.log("Token exists, length:", token.length);

      const apiUrl = `http://127.0.0.1:8000/users/${username}/`;
      console.log("Trying API URL:", apiUrl);

      fetch(apiUrl, {
        method: "GET",
        headers: {
          "auth-token": `${token}`,
          "Content-Type": "application/json"
        }
      })
      .then(async (res) => {
        const responseText = await res.text();
        console.log("Response status:", res.status);
        console.log("Response text:", responseText);

        if (!res.ok) {
          let errorDetail = responseText;
          try {
            const parsed = JSON.parse(responseText);
            errorDetail = JSON.stringify(parsed.detail || parsed);
          } catch(e) {
            // ignore
          }
          throw new Error(`HTTP ${res.status}: ${errorDetail}`);
        }

        return JSON.parse(responseText);
      })
      .then(data => {
        console.log("Success! User data:", data);

        userInfoDiv.innerHTML = `
          <p><strong>Full Name:</strong> ${data.fullname || '-'}</p>
          <p><strong>Username:</strong> ${data.username || username}</p>
          <p><strong>Email:</strong> ${data.email || '-'}</p>
          <p><strong>Phone:</strong> ${data.phone || '-'}</p>
          <p><strong>Address:</strong> ${data.address || '-'}</p>
        `;
      })
      .catch(err => {
        console.error("Fetch error:", err);

        userInfoDiv.innerHTML = `
          <p style="color:orange;">Trying with Authorization header...</p>
        `;

        fetch(apiUrl, {
          method: "GET",
          headers: {
            "Authorization": `Bearer ${token}`,
            "Content-Type": "application/json"
          }
        })
        .then(async (res) => {
          const responseText = await res.text();
          console.log("Second attempt response:", res.status, responseText);

          if (!res.ok) {
            throw new Error(`HTTP ${res.status}: ${responseText}`);
          }

          const data = JSON.parse(responseText);
          userInfoDiv.innerHTML = `
            <p><strong>Full Name:</strong> ${data.fullname || '-'}</p>
            <p><strong>Username:</strong> ${data.username || username}</p>
            <p><strong>Email:</strong> ${data.email || '-'}</p>
            <p><strong>Phone:</strong> ${data.phone || '-'}</p>
            <p><strong>Address:</strong> ${data.address || '-'}</p>
          `;
        })
        .catch(err2 => {
          console.error("Second attempt failed:", err2);

          userInfoDiv.innerHTML = `
            <p style="color:orange;">Trying with token only...</p>
          `;

          setTimeout(() => {
            fetch(apiUrl, {
              method: "GET",
              headers: {
                "auth-token": token,
                "Authorization": token,
                "Content-Type": "application/json"
              }
            })
            .then(async (res) => {
              const responseText = await res.text();
              if (res.ok) {
                const data = JSON.parse(responseText);
                userInfoDiv.innerHTML = `
                  <p><strong>Full Name:</strong> ${data.fullname || '-'}</p>
                  <p><strong>Username:</strong> ${data.username || username}</p>
                  <p><strong>Email:</strong> ${data.email || '-'}</p>
                  <p><strong>Phone:</strong> ${data.phone || '-'}</p>
                  <p><strong>Address:</strong> ${data.address || '-'}</p>
                `;
              } else {
                throw new Error(responseText);
              }
            })
            .catch(err3 => {
              console.error("All attempts failed");

              userInfoDiv.innerHTML = `
                <div style="background:#f8f9fa; padding:15px; border-radius:8px;">
                  <p><strong>Logged in as:</strong> ${username}</p>
                  <p><strong>Token:</strong> ${token.substring(0, 20)}...</p>
                  <p><small style="color:#666;">API expects different header format</small></p>
                  <p><small style="color:red;">Please check backend auth configuration</small></p>
                </div>
              `;
            });
          }, 1000);
        });
      });

    } catch (err) {
      console.error("Token parsing error:", err);
      localStorage.removeItem('access_token');
      window.location.href = 'login.html';
    }

  } else {
    setTimeout(() => window.location.href = 'login.html', 1000);
  }

  logoutForm.addEventListener('submit', e => {
    e.preventDefault();
    localStorage.removeItem('access_token');
    alert('You have been logged out.');
    window.location.href = 'login.html';
  });
</script>

  <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
</body>
</html>
